name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    tags:
      - "v[0-9]+0.[0-9]+.[0-9]+*"
  pull_request:
    branches: [ "master" ]
env:
  DOCKERHUB_ORG: elpaasoci

jobs:

  build_and_publish:
    name: build and publish
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    -
      name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    -
      # Setting up Docker Buildx with docker-container driver is required
      # at the moment to be able to use a subdirectory with Git context
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    -
      name: publish concourse-pipeline-resource standard image
      uses: docker/build-push-action@v4.0.0
      if: github.ref_type != 'tag'
      with:
        push: true
        file: ./dockerfiles/alpine/Dockerfile
        tags: |        
          ${{env.DOCKERHUB_ORG}}/${{env.IMAGE}}:latest
          ${{env.DOCKERHUB_ORG}}/${{env.IMAGE}}:${{github.sha}}
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{github.sha}}
      env:
        IMAGE: concourse-pipeline-resource
    -
      name: publish concourse-pipeline-resource tagged image
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v4.0.0
      with:
        push: true
        file: ./dockerfiles/alpine/Dockerfile
        tags: |
          ${{env.DOCKERHUB_ORG}}/${{env.IMAGE}}:latest
          ${{env.DOCKERHUB_ORG}}/${{env.IMAGE}}:${{github.sha}}
          ${{env.DOCKERHUB_ORG}}/${{env.IMAGE}}:${{github.ref_name}}
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{github.sha}}
          ghcr.io/${{ github.repository }}:${{github.ref_name}}
      env:
        IMAGE: concourse-pipeline-resource

